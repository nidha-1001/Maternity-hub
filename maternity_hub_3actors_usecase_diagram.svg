<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 1140" width="100%" height="100%" style="background-color: #ffffff; font-family: Arial, Helvetica, sans-serif;">
  <defs>
    <style>
      .sys-box { fill: #ffffff; stroke: #000000; stroke-width: 2.5; }
      .sys-title { font-size: 18px; font-weight: bold; text-anchor: middle; fill: #000000; letter-spacing: 1.5px; }
      .oval { fill: #ffffff; stroke: #000000; stroke-width: 1.8; rx: 135; ry: 19; }
      .oval-text { font-size: 13px; font-weight: 500; text-anchor: middle; fill: #000000; dominant-baseline: central; }
      .actor-line { stroke: #000000; stroke-width: 2.2; stroke-linecap: round; }
      .actor-head { fill: #ffffff; stroke: #000000; stroke-width: 2.2; }
      .actor-label { font-size: 13.5px; font-weight: bold; text-anchor: middle; fill: #000000; }
      .conn-line { stroke: #000000; stroke-width: 1.3; }
    </style>
  </defs>

  <!-- ================= SYSTEM BOUNDARY BOX ================= -->
  <rect x="290" y="30" width="440" height="1080" class="sys-box" />
  <text x="510" y="65" class="sys-title">MATERNITY HUB SYSTEM</text>

  <!-- ================= USE CASES ================= -->
  <!-- cx = 510, rx = 135. Left apex = 375, Right apex = 645 -->

  <!-- UC 1: cy = 105 -->
  <ellipse cx="510" cy="105" rx="135" ry="19" class="oval" />
  <text x="510" y="105" class="oval-text">Register / Login</text>

  <!-- UC 2: cy = 167 -->
  <ellipse cx="510" cy="167" rx="135" ry="19" class="oval" />
  <text x="510" y="167" class="oval-text">Manage Profile</text>

  <!-- UC 3: cy = 229 -->
  <ellipse cx="510" cy="229" rx="135" ry="19" class="oval" />
  <text x="510" y="229" class="oval-text">Search Maternity Centers</text>

  <!-- UC 4: cy = 291 -->
  <ellipse cx="510" cy="291" rx="135" ry="19" class="oval" />
  <text x="510" y="291" class="oval-text">View Services &amp; Packages</text>

  <!-- UC 5: cy = 353 -->
  <ellipse cx="510" cy="353" rx="135" ry="19" class="oval" />
  <text x="510" y="353" class="oval-text">Book Hospital Appointment</text>

  <!-- UC 6: cy = 415 -->
  <ellipse cx="510" cy="415" rx="135" ry="19" class="oval" />
  <text x="510" y="415" class="oval-text">Search &amp; Book Home Nurse</text>

  <!-- UC 7: cy = 477 -->
  <ellipse cx="510" cy="477" rx="135" ry="19" class="oval" />
  <text x="510" y="477" class="oval-text">Pay Online / Track Booking</text>

  <!-- UC 8: cy = 539 -->
  <ellipse cx="510" cy="539" rx="135" ry="19" class="oval" />
  <text x="510" y="539" class="oval-text">Submit Reviews &amp; Ratings</text>

  <!-- UC 9: cy = 601 -->
  <ellipse cx="510" cy="601" rx="135" ry="19" class="oval" />
  <text x="510" y="601" class="oval-text">Manage Center / Nurse Profile</text>

  <!-- UC 10: cy = 663 -->
  <ellipse cx="510" cy="663" rx="135" ry="19" class="oval" />
  <text x="510" y="663" class="oval-text">Manage Services &amp; Shift Rates</text>

  <!-- UC 11: cy = 725 -->
  <ellipse cx="510" cy="725" rx="135" ry="19" class="oval" />
  <text x="510" y="725" class="oval-text">Manage Booking Requests</text>

  <!-- UC 12: cy = 787 -->
  <ellipse cx="510" cy="787" rx="135" ry="19" class="oval" />
  <text x="510" y="787" class="oval-text">Verify &amp; Approve Providers</text>

  <!-- UC 13: cy = 849 -->
  <ellipse cx="510" cy="849" rx="135" ry="19" class="oval" />
  <text x="510" y="849" class="oval-text">Monitor Global Bookings &amp; Users</text>

  <!-- UC 14: cy = 911 -->
  <ellipse cx="510" cy="911" rx="135" ry="19" class="oval" />
  <text x="510" y="911" class="oval-text">Filter / Export Reports</text>

  <!-- UC 15: cy = 973 -->
  <ellipse cx="510" cy="973" rx="135" ry="19" class="oval" />
  <text x="510" y="973" class="oval-text">System Logout</text>


  <!-- ================= STICK FIGURES (3 ACTORS) ================= -->

  <!-- ACTOR 1 (LEFT): Patient / User -->
  <!-- Center: (125, 380), Hand anchor: (160, 420) -->
  <g id="actor-patient">
    <circle cx="125" cy="375" r="22" class="actor-head" />
    <line x1="125" y1="397" x2="125" y2="470" class="actor-line" />
    <line x1="88" y1="420" x2="162" y2="420" class="actor-line" />
    <line x1="125" y1="470" x2="92" y2="540" class="actor-line" />
    <line x1="125" y1="470" x2="158" y2="540" class="actor-line" />
    <text x="125" y="570" class="actor-label">Patient /</text>
    <text x="125" y="590" class="actor-label">Expectant Mother</text>
  </g>

  <!-- ACTOR 2 (RIGHT TOP): Healthcare Provider (Center & Nurse) -->
  <!-- Center: (880, 520), Hand anchor: (848, 560) -->
  <g id="actor-provider">
    <circle cx="880" cy="515" r="20" class="actor-head" />
    <line x1="880" y1="535" x2="880" y2="605" class="actor-line" />
    <line x1="846" y1="560" x2="914" y2="560" class="actor-line" />
    <line x1="880" y1="605" x2="852" y2="670" class="actor-line" />
    <line x1="880" y1="605" x2="908" y2="670" class="actor-line" />
    <text x="880" y="700" class="actor-label">Maternity Provider /</text>
    <text x="880" y="720" class="actor-label">Care Provider</text>
  </g>

  <!-- ACTOR 3 (RIGHT BOTTOM): System Admin -->
  <!-- Center: (880, 875), Hand anchor: (848, 915) -->
  <g id="actor-admin">
    <circle cx="880" cy="870" r="20" class="actor-head" />
    <line x1="880" y1="890" x2="880" y2="960" class="actor-line" />
    <line x1="846" y1="915" x2="914" y2="915" class="actor-line" />
    <line x1="880" y1="960" x2="852" y2="1025" class="actor-line" />
    <line x1="880" y1="960" x2="908" y2="1025" class="actor-line" />
    <text x="880" y="1055" class="actor-label">Administrator</text>
  </g>


  <!-- ================= ZERO-OVERLAP ASSOCIATION LINES ================= -->

  <!-- Left: Patient connections -->
  <line x1="162" y1="420" x2="375" y2="105" class="conn-line" /> <!-- Register / Login -->
  <line x1="162" y1="420" x2="375" y2="167" class="conn-line" /> <!-- Manage Profile -->
  <line x1="162" y1="420" x2="375" y2="229" class="conn-line" /> <!-- Search Centers -->
  <line x1="162" y1="420" x2="375" y2="291" class="conn-line" /> <!-- View Services -->
  <line x1="162" y1="420" x2="375" y2="353" class="conn-line" /> <!-- Book Appointment -->
  <line x1="162" y1="420" x2="375" y2="415" class="conn-line" /> <!-- Search & Book Nurse -->
  <line x1="162" y1="420" x2="375" y2="477" class="conn-line" /> <!-- Pay Online / Track -->
  <line x1="162" y1="420" x2="375" y2="539" class="conn-line" /> <!-- Submit Reviews -->
  <line x1="162" y1="420" x2="375" y2="973" class="conn-line" /> <!-- System Logout -->

  <!-- Right Top: Provider connections -->
  <line x1="846" y1="560" x2="645" y2="291" class="conn-line" /> <!-- View Services & Packages -->
  <line x1="846" y1="560" x2="645" y2="353" class="conn-line" /> <!-- Book Hospital Appointment -->
  <line x1="846" y1="560" x2="645" y2="415" class="conn-line" /> <!-- Search & Book Home Nurse -->
  <line x1="846" y1="560" x2="645" y2="601" class="conn-line" /> <!-- Manage Center / Nurse Profile -->
  <line x1="846" y1="560" x2="645" y2="663" class="conn-line" /> <!-- Manage Services & Shift Rates -->
  <line x1="846" y1="560" x2="645" y2="725" class="conn-line" /> <!-- Manage Booking Requests -->

  <!-- Right Bottom: Admin connections -->
  <line x1="846" y1="915" x2="645" y2="787" class="conn-line" /> <!-- Verify & Approve Providers -->
  <line x1="846" y1="915" x2="645" y2="849" class="conn-line" /> <!-- Monitor Global Bookings -->
  <line x1="846" y1="915" x2="645" y2="911" class="conn-line" /> <!-- Filter / Export Reports -->
  <line x1="846" y1="915" x2="645" y2="973" class="conn-line" /> <!-- System Logout -->

</svg>
