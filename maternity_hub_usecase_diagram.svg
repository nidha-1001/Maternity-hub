<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 1180" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #1e293b; stroke-width: 2.5; }
      .title { font-size: 19px; font-weight: 800; text-anchor: middle; fill: #0f172a; letter-spacing: 1.5px; }
      .usecase { fill: #ffffff; stroke: #334155; stroke-width: 1.8; rx: 145; ry: 21; }
      .usecase-text { font-size: 13.5px; font-weight: 600; text-anchor: middle; fill: #1e293b; dominant-baseline: central; }
      .actor-line { stroke: #1e293b; stroke-width: 2.2; stroke-linecap: round; }
      .actor-label { font-size: 15px; font-weight: 700; text-anchor: middle; fill: #0f172a; }
      .conn-line { stroke: #475569; stroke-width: 1.3; }
    </style>
  </defs>

  <!-- SYSTEM BOUNDARY BOX -->
  <rect x="235" y="40" width="450" height="1100" class="box" rx="6" />
  <text x="460" y="80" class="title">MATERNITY HUB SYSTEM</text>

  <!-- USE CASES (ELLIPSES) -->
  <!-- 1. Register / Login -->
  <ellipse cx="460" cy="130" rx="150" ry="22" class="usecase" />
  <text x="460" y="130" class="usecase-text">Register / Login</text>

  <!-- 2. Search & Filter Maternity Centers -->
  <ellipse cx="460" cy="195" rx="150" ry="22" class="usecase" />
  <text x="460" y="195" class="usecase-text">Search &amp; Filter Centers</text>

  <!-- 3. View Center Profile & Services -->
  <ellipse cx="460" cy="260" rx="150" ry="22" class="usecase" />
  <text x="460" y="260" class="usecase-text">View Center Profile &amp; Services</text>

  <!-- 4. Book Center Appointment -->
  <ellipse cx="460" cy="325" rx="150" ry="22" class="usecase" />
  <text x="460" y="325" class="usecase-text">Book Center Appointment</text>

  <!-- 5. Search & View Home Nurses -->
  <ellipse cx="460" cy="390" rx="150" ry="22" class="usecase" />
  <text x="460" y="390" class="usecase-text">Search &amp; View Home Nurses</text>

  <!-- 6. Book Postnatal / Nurse Care -->
  <ellipse cx="460" cy="455" rx="150" ry="22" class="usecase" />
  <text x="460" y="455" class="usecase-text">Book Postnatal Nurse Care</text>

  <!-- 7. Pay Online (Checkout) -->
  <ellipse cx="460" cy="520" rx="150" ry="22" class="usecase" />
  <text x="460" y="520" class="usecase-text">Pay Online (Checkout)</text>

  <!-- 8. Track & Cancel Bookings -->
  <ellipse cx="460" cy="585" rx="150" ry="22" class="usecase" />
  <text x="460" y="585" class="usecase-text">Track &amp; Manage Appointments</text>

  <!-- 9. Submit Reviews & Ratings -->
  <ellipse cx="460" cy="650" rx="150" ry="22" class="usecase" />
  <text x="460" y="650" class="usecase-text">Submit Reviews &amp; Ratings</text>

  <!-- 10. Manage Center Profile & Services -->
  <ellipse cx="460" cy="715" rx="150" ry="22" class="usecase" />
  <text x="460" y="715" class="usecase-text">Manage Center Services &amp; Pricing</text>

  <!-- 11. Manage Nurse Profiles -->
  <ellipse cx="460" cy="780" rx="150" ry="22" class="usecase" />
  <text x="460" y="780" class="usecase-text">Manage Nurse Profiles &amp; Shifts</text>

  <!-- 12. Accept / Reject Bookings -->
  <ellipse cx="460" cy="845" rx="150" ry="22" class="usecase" />
  <text x="460" y="845" class="usecase-text">Accept / Reject Booking Requests</text>

  <!-- 13. Verify & Approve Providers -->
  <ellipse cx="460" cy="910" rx="150" ry="22" class="usecase" />
  <text x="460" y="910" class="usecase-text">Verify &amp; Approve Centers / Nurses</text>

  <!-- 14. Monitor Global Bookings & Users -->
  <ellipse cx="460" cy="975" rx="150" ry="22" class="usecase" />
  <text x="460" y="975" class="usecase-text">Monitor Global Bookings &amp; Users</text>

  <!-- 15. View Analytics & Reports -->
  <ellipse cx="460" cy="1040" rx="150" ry="22" class="usecase" />
  <text x="460" y="1040" class="usecase-text">View Analytics &amp; Reports</text>

  <!-- 16. Logout -->
  <ellipse cx="460" cy="1100" rx="150" ry="20" class="usecase" />
  <text x="460" y="1100" class="usecase-text">Logout</text>

  <!-- ================= ACTORS ================= -->

  <!-- ACTOR 1: Patient / Expectant Mother (LEFT) -->
  <!-- Base position: (100, 480) -->
  <g id="actor-patient">
    <circle cx="100" cy="445" r="18" fill="#ffffff" stroke="#1e293b" stroke-width="2.2" />
    <!-- Body -->
    <line x1="100" y1="463" x2="100" y2="515" class="actor-line" />
    <!-- Arms -->
    <line x1="68" y1="480" x2="132" y2="480" class="actor-line" />
    <!-- Left Leg -->
    <line x1="100" y1="515" x2="72" y2="560" class="actor-line" />
    <!-- Right Leg -->
    <line x1="100" y1="515" x2="128" y2="560" class="actor-line" />
    <!-- Label -->
    <text x="100" y="585" class="actor-label">Patient /</text>
    <text x="100" y="605" class="actor-label">Expectant Mother</text>
  </g>

  <!-- ACTOR 2: Maternity Provider / Nurse (RIGHT TOP) -->
  <!-- Base position: (820, 560) -->
  <g id="actor-provider">
    <circle cx="820" cy="530" r="18" fill="#ffffff" stroke="#1e293b" stroke-width="2.2" />
    <!-- Body -->
    <line x1="820" y1="548" x2="820" y2="600" class="actor-line" />
    <!-- Arms -->
    <line x1="788" y1="565" x2="852" y2="565" class="actor-line" />
    <!-- Left Leg -->
    <line x1="820" y1="600" x2="792" y2="645" class="actor-line" />
    <!-- Right Leg -->
    <line x1="820" y1="600" x2="848" y2="645" class="actor-line" />
    <!-- Label -->
    <text x="820" y="670" class="actor-label">Maternity Center /</text>
    <text x="820" y="690" class="actor-label">Care Provider</text>
  </g>

  <!-- ACTOR 3: Administrator (RIGHT BOTTOM) -->
  <!-- Base position: (820, 930) -->
  <g id="actor-admin">
    <circle cx="820" cy="900" r="18" fill="#ffffff" stroke="#1e293b" stroke-width="2.2" />
    <!-- Body -->
    <line x1="820" y1="918" x2="820" y2="970" class="actor-line" />
    <!-- Arms -->
    <line x1="788" y1="935" x2="852" y2="935" class="actor-line" />
    <!-- Left Leg -->
    <line x1="820" y1="970" x2="792" y2="1015" class="actor-line" />
    <!-- Right Leg -->
    <line x1="820" y1="970" x2="848" y2="1015" class="actor-line" />
    <!-- Label -->
    <text x="820" y="1040" class="actor-label">Administrator</text>
  </g>

  <!-- ================= ASSOCIATION LINES ================= -->

  <!-- Left Actor (Patient) Connections (Anchor from ~135, 480) -->
  <line x1="135" y1="480" x2="310" y2="130" class="conn-line" /> <!-- Register / Login -->
  <line x1="135" y1="480" x2="310" y2="195" class="conn-line" /> <!-- Search Centers -->
  <line x1="135" y1="480" x2="310" y2="260" class="conn-line" /> <!-- View Center Details -->
  <line x1="135" y1="480" x2="310" y2="325" class="conn-line" /> <!-- Book Appointment -->
  <line x1="135" y1="480" x2="310" y2="390" class="conn-line" /> <!-- Search Nurses -->
  <line x1="135" y1="480" x2="310" y2="455" class="conn-line" /> <!-- Book Nurse -->
  <line x1="135" y1="480" x2="310" y2="520" class="conn-line" /> <!-- Pay Online -->
  <line x1="135" y1="480" x2="310" y2="585" class="conn-line" /> <!-- Track / Cancel Bookings -->
  <line x1="135" y1="480" x2="310" y2="650" class="conn-line" /> <!-- Add Review & Rating -->
  <line x1="135" y1="480" x2="310" y2="1100" class="conn-line" /> <!-- Logout -->

  <!-- Right Top Actor (Provider) Connections (Anchor from ~785, 565) -->
  <line x1="785" y1="565" x2="610" y2="130" class="conn-line" /> <!-- Register / Login -->
  <line x1="785" y1="565" x2="610" y2="585" class="conn-line" /> <!-- Track Bookings -->
  <line x1="785" y1="565" x2="610" y2="650" class="conn-line" /> <!-- View Reviews -->
  <line x1="785" y1="565" x2="610" y2="715" class="conn-line" /> <!-- Manage Services -->
  <line x1="785" y1="565" x2="610" y2="780" class="conn-line" /> <!-- Manage Nurse Profiles -->
  <line x1="785" y1="565" x2="610" y2="845" class="conn-line" /> <!-- Accept/Reject Bookings -->
  <line x1="785" y1="565" x2="610" y2="1100" class="conn-line" /> <!-- Logout -->

  <!-- Right Bottom Actor (Admin) Connections (Anchor from ~785, 935) -->
  <line x1="785" y1="935" x2="610" y2="130" class="conn-line" /> <!-- Register / Login -->
  <line x1="785" y1="935" x2="610" y2="585" class="conn-line" /> <!-- Track / Manage All Bookings -->
  <line x1="785" y1="935" x2="610" y2="910" class="conn-line" /> <!-- Verify & Approve Centers/Nurses -->
  <line x1="785" y1="935" x2="610" y2="975" class="conn-line" /> <!-- Monitor Global Bookings & Users -->
  <line x1="785" y1="935" x2="610" y2="1040" class="conn-line" /> <!-- View Analytics & Reports -->
  <line x1="785" y1="935" x2="610" y2="1100" class="conn-line" /> <!-- Logout -->

</svg>
